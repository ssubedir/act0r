[package]
name = "act0r-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Durable actor execution, application ports and local adapters for act0r"
license = "MIT"
# Workspace component; independent crates.io publication is not configured yet.
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest.workspace = true
sha2.workspace = true
httpdate.workspace = true
toml.workspace = true
tempfile.workspace = true
futures-util.workspace = true
rmcp.workspace = true
jsonschema.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
axum.workspace = true
